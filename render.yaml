services:
  - type: web
    name: gridwise-energy-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: LLM_TIMEOUT_SEC
        value: 15.0
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false
